name: Python Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "**/pyproject.toml"
      - "mise.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/python-checks.yml"
  push:
    branches:
      - master
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "**/pyproject.toml"
      - "mise.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/python-checks.yml"

permissions:
  contents: read

jobs:
  format:
    name: Ruff Format
    runs-on: [self-hosted, Linux, X64, eve, ci, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4

      - name: Check Python formatting
        run: make python-format-check

  type-check:
    name: Ty Check (ingestion)
    runs-on: [self-hosted, Linux, X64, eve, ci, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4

      - name: Run type check
        run: make python-ty-check
