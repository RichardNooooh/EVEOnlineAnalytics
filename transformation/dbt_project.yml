name: eve_market_transform
version: 1.0.0
config-version: 2

profile: eve_market_transform

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages", "logs"]

models:
  eve_market_transform:
    staging:
      +materialized: view
    marts:
      +materialized: table
      mart_curated_daily_prices:
        +database: "{{ env_var('CURATED_DUCKLAKE_ALIAS', 'curated_lake') }}"
        +schema: "{{ env_var('CURATED_DUCKLAKE_SCHEMA', 'curated') }}"
        +alias: curated_daily_prices
      mart_curated_trade_volume:
        +database: "{{ env_var('CURATED_DUCKLAKE_ALIAS', 'curated_lake') }}"
        +schema: "{{ env_var('CURATED_DUCKLAKE_SCHEMA', 'curated') }}"
        +alias: curated_trade_volume
