[project]
name = "ingestion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dlt[ducklake,http]>=1.26.0",
    "duckdb>=1.5.2",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.33.1",
]

[project.scripts]
eve-ingest = "ingest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
