version: 2

seeds:
  - name: forge_study_panel
    description: >-
      Frozen Forge study membership selected over 2022-06-01 through 2022-09-30
      inclusive. Seven curated minerals unioned with the top 50 published manufactured
      Tech I types by history order count and the top 50 by estimated traded ISK.
      The ISK ranking requires total history order count >= the inclusive window
      length (122 days), before ranking. Categories are manually assigned presentation
      labels, not selection filters or authoritative inventory classifications. The
      mineral component is type IDs 34 through 40; 11399 is excluded.
      Generated by the selection notebook from selected IDs and manual categories.
      Review generated changes and rebuild dbt before analyzing panel history.
    config:
      column_types:
        type_id: bigint
        study_category: varchar
    columns:
      - name: type_id
        description: Frozen item type identifier; the seed's unique key.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('stg_everef_ref_types')
                field: type_id
      - name: study_category
        description: Owner-maintained grouping for study tables and charts.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Light ships
                  - Cruisers and battlecruisers
                  - Battleships
                  - Mining and industrial ships
                  - Freighters
                  - Mobility and concealment
                  - Defense and repair
                  - Exploration and resource recovery
                  - Miscellaneous modules
                  - Rigs
                  - Drones
                  - Ammunition and probes
                  - Deployables
                  - Minerals
