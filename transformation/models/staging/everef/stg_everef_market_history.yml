version: 2

models:
  - name: stg_everef_market_history
    description: Typed Everef market-history staging model with ESI average preserved as VWAP.
    columns:
      - name: market_date
        description: Source market date.
        tests:
          - not_null
      - name: region_id
        description: Market region identifier.
        tests:
          - not_null
      - name: type_id
        description: Item type identifier.
        tests:
          - not_null
      - name: average
        description: Volume-weighted average price from ESI market history.
        tests:
          - not_null
      - name: highest
        description: Highest observed price.
        tests:
          - not_null
      - name: lowest
        description: Lowest observed price.
        tests:
          - not_null
      - name: order_count
        description: Count of market orders.
        tests:
          - not_null
      - name: volume
        description: Traded volume.
        tests:
          - not_null
