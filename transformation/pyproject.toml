[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "transform"
version = "0.1.0"
description = "dbt project for curated market transforms"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.11.9",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/transform"]

[tool.uv]
exclude-newer = "1 week"

[dependency-groups]
dev = [
    "sqlfluff>=4.2.1",
]
