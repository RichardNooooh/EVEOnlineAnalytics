version: 2

models:
  - name: stg_everef_ref_categories
    description: >-
      Typed scratch view of the latest full inventory-category extract, one row
      per category_id. Includes published and unpublished categories.
    columns:
      - name: category_id
        data_type: bigint
        description: Stable inventory category identifier.
        tests:
          - not_null
          - unique
      - name: name_en
        data_type: varchar
        description: English inventory category name.
        tests:
          - not_null
      - name: published
        data_type: boolean
        description: Source publication flag for the inventory category.
      - name: icon_id
        data_type: bigint
        description: Icon identifier.
