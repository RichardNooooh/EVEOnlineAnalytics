version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(levelname)s [%(name)s]: %(message)s'

handlers:
  stderr:
    class: logging.StreamHandler
    level: NOTSET
    formatter: standard
    stream: ext://sys.stderr

loggers:
  eve_ingest:
    level: DEBUG
    handlers:
      - stderr
    propagate: false

root:
  level: WARNING
  handlers:
    - stderr
