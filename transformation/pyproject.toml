[project]
name = "eve-market-transformation"
version = "0.1.0"
description = "dbt project for curated market transforms"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dbt-core>=1.11.9",
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.2",
]

[dependency-groups]
dev = [
    "sqlfluff>=4.2.1",
    "sqlfluff-templater-dbt",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transform"]
