name: SQL Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "transformation/**"
      - "mise.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/sql-checks.yml"
  push:
    branches:
      - master
    paths:
      - "transformation/**"
      - "mise.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/sql-checks.yml"

permissions:
  contents: read

jobs:
  lint:
    name: SQLFluff Lint
    runs-on: [self-hosted, Linux, X64, eve, ci, python]
    defaults:
      run:
        working-directory: ./transformation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4

      - name: Sync Project
        run: uv sync --group dev --frozen

      - name: Install dbt packages
        run: uv run dbt deps --profiles-dir .

      - name: Lint SQL (transformation)
        run: uv run sqlfluff lint . --ignore-local-config --config .sqlfluff.dbt
