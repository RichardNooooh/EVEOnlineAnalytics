name: Ingestion Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ingestion/**"
      - "!ingestion/**/*.md"
      - "mise.toml"
      - ".github/workflows/ingestion-image.yml"
  push:
    branches:
      - master
    paths:
      - "ingestion/**"
      - "!ingestion/**/*.md"
      - "mise.toml"
      - ".github/workflows/ingestion-image.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate Ingestion Image
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ingestion
          file: ingestion/Dockerfile
          push: false

  publish:
    name: Publish Ingestion Image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/eve-market-ingestion
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: ingestion
          file: ingestion/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
