[settings]
minimum_release_age = "7d"

[tools]
# Python ecosystem
python = "3.13"
uv = "latest"

# Tools
jq = "latest"
ripgrep = "latest"

# Data engineering — dbt-core via pipx (not a standalone binary)
"pipx:dbt-core" = "latest"

# Python linting/formatting
ruff = "latest"
pre-commit = "latest"

# Pre-Commit Linting
"pipx:pre-commit" = "latest"
