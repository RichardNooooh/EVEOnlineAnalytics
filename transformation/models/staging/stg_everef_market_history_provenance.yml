version: 2

models:
  - name: stg_everef_market_history_provenance
    description: Typed Everef market-history provenance staging model for lineage and debugging.
    columns:
      - name: market_date
        description: Source market date stored on the published row.
        tests:
          - not_null
      - name: region_id
        description: Market region identifier.
        tests:
          - not_null
      - name: type_id
        description: Item type identifier.
        tests:
          - not_null
      - name: source_market_date
        description: Source file date from the source-object provenance row.
        tests:
          - not_null
      - name: row_source_market_date
        description: Source file date stored on the published market-history row.
        tests:
          - not_null
      - name: source_ref_id
        description: Deterministic object ID for source-file lineage.
        tests:
          - not_null
      - name: source_url
        description: Source URL used to identify the published file.
        tests:
          - not_null
      - name: storage_uri
        description: Raw-object storage URI when available.
      - name: source_sha256
        description: SHA-256 of the cached source file when available.
      - name: source_content_length
        description: Source content length in bytes when available.
      - name: source_last_modified
        description: Source last-modified timestamp string when available.
      - name: source_downloaded_at
        description: Download timestamp for cached source files when available.
      - name: ingested_at
        description: Ingestion timestamp recorded when the file was loaded.
        tests:
          - not_null
      - name: parsed_at
        description: Parse timestamp recorded when the file was parsed.
      - name: status
        description: Source-object ingestion status.
        tests:
          - not_null
