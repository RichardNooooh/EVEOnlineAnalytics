name: SQL Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "transformation/**"
      - "mise.toml"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - ".sqlfluff"
      - ".sqlfluffignore"
      - ".github/workflows/sql-checks.yml"
  push:
    branches:
      - master
    paths:
      - "transformation/**"
      - "mise.toml"
      - "Makefile"
      - ".pre-commit-config.yaml"
      - ".sqlfluff"
      - ".sqlfluffignore"
      - ".github/workflows/sql-checks.yml"

permissions:
  contents: read

jobs:
  lint:
    name: SQLFluff Lint
    runs-on: [self-hosted, Linux, X64, eve, ci, python]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4

      - name: Sync transformation dependencies
        run: uv sync --project transformation --group dev --frozen

      - name: Lint transformation SQL
        run: make sql-lint
