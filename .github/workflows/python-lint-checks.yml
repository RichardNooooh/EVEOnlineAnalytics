name: Python Checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "**/pyproject.toml"
      - "mise.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/python-lint-checks.yml"
  push:
    branches:
      - master
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "**/pyproject.toml"
      - "mise.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/python-lint-checks.yml"

permissions:
  contents: read

jobs:
  format:
    name: Ruff Format and Lint
    runs-on: [self-hosted, Linux, X64, eve, ci, python]

    steps:
      - name: Checkout repository
         uses: actions/checkout@v4

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4

      - name: Install ruff tool
        run: uv tool install ruff

      - name: Check Python linting
        run: uvx ruff check --output-format=github .

      - name: Check Python formatting
        run: uvx ruff format --check --diff .
