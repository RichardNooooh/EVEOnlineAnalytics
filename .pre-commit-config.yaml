---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: trailing-whitespace
        args:
          - --markdown-linebreak-ext=md
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: python-ruff-format
        name: python ruff format
        entry: ruff format
        language: system
        files: \.(py|pyi)$
      - id: python-ruff-check
        name: python ruff check
        entry: ruff check
        language: system
        files: \.(py|pyi)$
      - id: sqlfluff-fix
        name: sqlfluff fix
        entry: uv run --project transformation sqlfluff fix --force
        language: system
        files: ^transformation/.*\.sql$
        exclude: ^transformation/(target|dbt_packages|macros|\.venv)/
      - id: sqlfluff-lint
        name: sqlfluff lint
        entry: uv run --project transformation sqlfluff lint
        language: system
        files: ^transformation/.*\.sql$
        exclude: ^transformation/(target|dbt_packages|macros|\.venv)/
      - id: ty-check
        name: ty check (ingestion)
        entry: uv run --project ingestion ty check ingestion/
        language: system
        pass_filenames: false
        require_serial: true
        files: ^ingestion/.*\.py$
