[project]
name = "eve-market-ingestion"
version = "0.1.0"
description = "Ingestion package for eve-market."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "dlt[ducklake,http]>=1.27.0",
    "duckdb>=1.5.3",
    "pandas>=3.0.2",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "pyyaml>=6.0.2",
    "requests>=2.33.1",
    "sqlalchemy>=2.0.50",
]

[project.scripts]
eve-ingest = "eve_ingest.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eve_ingest"]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "typecheck" },
]

test = [
    "pytest>=9.0.2",
    "testcontainers[postgres]>=4.14.2",
]

typecheck = [
    "ty", "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
exclude-newer = "1 week"
