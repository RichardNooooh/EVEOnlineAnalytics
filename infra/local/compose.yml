name: eve-market-local

x-airflow-common: &airflow-common
  image: apache/airflow:${AIRFLOW_VERSION:?Set AIRFLOW_VERSION in infra/local/versions.txt}-python${PYTHON_VERSION:?Set PYTHON_VERSION in infra/local/versions.txt}
  environment: &airflow-common-env
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in infra/local/.env}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in infra/local/.env}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAG_DISCOVERY_SAFE_MODE: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/local/.env}@postgres:5432/${POSTGRES_DB:-airflow}
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    EVE_MARKET_LOCAL_DATA_HOST_PATH: ${EVE_MARKET_LOCAL_DATA_HOST_PATH:?Set EVE_MARKET_LOCAL_DATA_HOST_PATH in infra/local/.env}
    POSTGRES_DB: ${POSTGRES_DB:-airflow}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/local/.env}
    POSTGRES_USER: ${POSTGRES_USER:-airflow}
    RAW_FILES_POSTGRES_PASSWORD: ${RAW_FILES_POSTGRES_PASSWORD:?Set RAW_FILES_POSTGRES_PASSWORD in infra/local/.env}
    INGESTION_APP_GID: ${INGESTION_APP_GID:-10001}
    INGESTION_APP_UID: ${INGESTION_APP_UID:-10001}
    PYTHONPATH: /opt/eve-market/ingestion:/opt/airflow/dags
  user: "${AIRFLOW_UID:-50000}:0"
  group_add:
    - "${DOCKER_GID:-1001}"
  volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - ../../orchestration/dags:/opt/airflow/dags
    - ../../orchestration/eve_market_airflow:/opt/airflow/dags/eve_market_airflow:ro
    - ../../ingestion:/opt/eve-market/ingestion
    - ../../transformation:/opt/eve-market/transform
    - ../../datasets:/opt/eve-market/datasets
    - ../../.local/data:/opt/eve-market/data
    - ../../.local/logs:/opt/airflow/logs
  networks:
    - local_jobs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/local/.env}
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      RAW_FILES_POSTGRES_PASSWORD: ${RAW_FILES_POSTGRES_PASSWORD:?Set RAW_FILES_POSTGRES_PASSWORD in infra/local/.env}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    networks:
      - local_jobs

  evidence:
    image: node:22-bookworm-slim
    profiles: ["bi"]
    working_dir: /workspace
    environment:
      EVIDENCE_VAR__CURATED_DUCKLAKE_ATTACH_PATH: ducklake:postgres:dbname=${POSTGRES_DB:-airflow} host=postgres port=5432 user=${POSTGRES_USER:-airflow} password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/local/.env}
      EVIDENCE_VAR__CURATED_DUCKLAKE_DATA_PATH: /data/datasets/ducklake
      EVIDENCE_VAR__CURATED_DUCKLAKE_ALIAS: curated_lake
      EVIDENCE_VAR__CURATED_DUCKLAKE_SCHEMA: curated
      EVIDENCE_VAR__CURATED_DUCKLAKE_METADATA_SCHEMA: eve_market
      EVIDENCE_VAR__CURATED_DUCKLAKE_OVERRIDE_DATA_PATH: "true"
      npm_config_cache: /tmp/npm-cache
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -x node_modules/.bin/evidence ]; then
          npm ci
        fi
        npm run sources
        npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ../../bi:/workspace
      - ../../.local/data:/data:ro
      - evidence-node-modules:/workspace/node_modules
      - evidence-cache:/workspace/.evidence
      - evidence-static-data:/workspace/static/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - local_jobs

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    user: "0:0"
    command:
      - -c
      - |
        set -e
        mkdir -p /opt/airflow/logs /opt/eve-market/data
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        chown -R "${INGESTION_APP_UID:-10001}:${INGESTION_APP_GID:-10001}" /opt/eve-market/data
        chmod -R a+rwX /opt/eve-market/data
        exec /entrypoint bash -c 'set -e; airflow db migrate; airflow users create --username "${AIRFLOW_ADMIN_USERNAME:-admin}" --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" --firstname Local --lastname Admin --role Admin --email "${AIRFLOW_ADMIN_EMAIL:-admin@example.com}" || true'

  airflow-api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  airflow-cli:
    <<: *airflow-common
    profiles: ["cli"]
    command: bash
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  evidence-node-modules:
  evidence-cache:
  evidence-static-data:

networks:
  local_jobs:
    name: eve-market-airflow-local
