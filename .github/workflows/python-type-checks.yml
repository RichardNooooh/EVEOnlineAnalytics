name: Python Type Check (Ingestion)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ingestion/**"
      - "pyproject.toml"
      - "mise.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/python-type-checks.yml"
  push:
    branches:
      - master
    paths:
      - "ingestion/**"
      - "pyproject.toml"
      - "mise.toml"
      - ".pre-commit-config.yaml"
      - ".github/workflows/python-type-checks.yml"

permissions:
  contents: read

jobs:
  type-check:
    name: Ty Check (ingestion)
    runs-on: [self-hosted, Linux, X64, eve, ci, python]
    defaults:
      run:
        working-directory: ./ingestion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain with mise
        uses: jdx/mise-action@v4

      - name: Sync Project
        run: uv sync --group dev --frozen

      - name: Run type check
        run: uv run ty check --output-format github .
